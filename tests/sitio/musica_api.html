<!doctype html><html><head><meta charset="utf-8"></head><body><div id="app">Cargando...</div>
<script>
fetch('/api/eventos.json').then(r => r.json()).then(d => {
  // Dibuja tarjetas sin enlaces ni fechas en texto (solo para forzar la estrategia JSON).
  document.getElementById('app').innerHTML = d.data.items.map(e => `<div onclick="location='${e.slug}'">${e.nombre}</div>`).join('');
});
</script></body></html>
